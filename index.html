<script>
// ============================================================
// SCRIPT DE CONTROLE — TELA DE NOMES + QUIZ DAS CASAS
// Funciona independentemente do script.js
// ============================================================
(function () {
    "use strict";

    // -------- QUIZ DAS CASAS (embutido) --------
    var houseQuiz = [
        {
            question: "Você encontra um colega em perigo. O que faz?",
            answers: [
                { text: "Enfrento o perigo imediatamente.", house: "Grifinória", attribute: "bravery" },
                { text: "Fico ao lado dele e não o abandono.", house: "Lufa-Lufa", attribute: "loyalty" },
                { text: "Analiso a situação antes de agir.", house: "Corvinal", attribute: "intelligence" },
                { text: "Procuro uma maneira de transformar a situação em vantagem.", house: "Sonserina", attribute: "ambition" },
                { text: "Tento entender o que ele está sentindo.", house: "Lufa-Lufa", attribute: "empathy" }
            ]
        },
        {
            question: "Você recebe acesso a uma biblioteca proibida. O que procura?",
            answers: [
                { text: "Um livro sobre grandes feitos heroicos.", house: "Grifinória", attribute: "bravery" },
                { text: "Informações que possam ajudar meus amigos.", house: "Lufa-Lufa", attribute: "loyalty" },
                { text: "Conhecimento que ninguém mais descobriu.", house: "Corvinal", attribute: "intelligence" },
                { text: "Conhecimento que me dê poder.", house: "Sonserina", attribute: "ambition" },
                { text: "Um livro sobre sentimentos e comportamento humano.", house: "Lufa-Lufa", attribute: "empathy" }
            ]
        },
        {
            question: "Qual destas características mais combina com você?",
            answers: [
                { text: "Coragem.", house: "Grifinória", attribute: "bravery" },
                { text: "Lealdade.", house: "Lufa-Lufa", attribute: "loyalty" },
                { text: "Curiosidade.", house: "Corvinal", attribute: "intelligence" },
                { text: "Determinação.", house: "Sonserina", attribute: "ambition" },
                { text: "Empatia.", house: "Lufa-Lufa", attribute: "empathy" }
            ]
        },
        {
            question: "Quando alguém duvida de você, qual é sua reação?",
            answers: [
                { text: "Provo que sou capaz.", house: "Grifinória", attribute: "bravery" },
                { text: "Continuo fazendo o meu melhor.", house: "Lufa-Lufa", attribute: "loyalty" },
                { text: "Tento descobrir por que a pessoa pensa assim.", house: "Corvinal", attribute: "intelligence" },
                { text: "Uso a dúvida como motivação para vencer.", house: "Sonserina", attribute: "ambition" },
                { text: "Tento compreender a insegurança da pessoa.", house: "Lufa-Lufa", attribute: "empathy" }
            ]
        },
        {
            question: "Você encontra um artefato mágico extremamente poderoso.",
            answers: [
                { text: "Uso-o para proteger alguém.", house: "Grifinória", attribute: "bravery" },
                { text: "Guardo-o para impedir que outras pessoas se machuquem.", house: "Lufa-Lufa", attribute: "loyalty" },
                { text: "Estudo cuidadosamente seu funcionamento.", house: "Corvinal", attribute: "intelligence" },
                { text: "Descubro como usar seu poder a meu favor.", house: "Sonserina", attribute: "ambition" },
                { text: "Penso primeiro nas consequências para todos.", house: "Lufa-Lufa", attribute: "empathy" }
            ]
        }
    ];

    // -------- ESTADO DO QUIZ --------
    var quizPlayer = null;     // "sasah" ou "lucas"
    var quizIndex = 0;
    var quizAnswers = { sasah: [], lucas: [] };

    // -------- GARANTE ESTRUTURA DO GAME --------
    function ensureGame() {
        if (!window.game || typeof window.game !== "object") {
            window.game = {};
        }
        if (!window.game.sasah) window.game.sasah = { name: "Sasah", house: "Indefinida", hp: 100, maxHp: 100, mana: 100, maxMana: 100, xp: 0, level: 1, bravery: 0, loyalty: 0, intelligence: 0, ambition: 0, empathy: 0, magic: 0 };
        if (!window.game.lucas) window.game.lucas = { name: "Lucas", house: "Indefinida", hp: 100, maxHp: 100, mana: 100, maxMana: 100, xp: 0, level: 1, bravery: 0, loyalty: 0, intelligence: 0, ambition: 0, empathy: 0, magic: 0 };
        if (!window.game.houseAnswers) window.game.houseAnswers = { sasah: [], lucas: [] };
        if (!window.game.relationship) window.game.relationship = { friendship: 50, trust: 50, rivalry: 0, affinity: 50 };
        if (!window.game.kiwi) window.game.kiwi = { name: "Kiwi", trust: 0, discovered: false, rescued: false };
        if (!window.game.flags) window.game.flags = {};
        if (!window.game.log) window.game.log = [];
    }

    // -------- CALCULA A CASA --------
    function calcularCasa(characterKey) {
        var answers = quizAnswers[characterKey] || [];
        var scores = { "Grifinória": 0, "Lufa-Lufa": 0, "Corvinal": 0, "Sonserina": 0 };

        answers.forEach(function (a) {
            if (a && a.house && scores[a.house] !== undefined) {
                scores[a.house] += 1;
            }
        });

        var bestHouse = "Grifinória";
        var bestScore = scores[bestHouse];
        Object.keys(scores).forEach(function (h) {
            if (scores[h] > bestScore) {
                bestHouse = h;
                bestScore = scores[h];
            }
        });
        return bestHouse;
    }

    // -------- RENDERIZA UMA PERGUNTA --------
    function renderPergunta() {
        var sceneEl = document.getElementById("scene");
        var choicesEl = document.getElementById("choices");
        if (!sceneEl || !choicesEl) return;

        var character = window.game[quizPlayer];
        var pergunta = houseQuiz[quizIndex];

        // Cabeçalho
        var chapterEl = document.getElementById("chapter");
        var locationEl = document.getElementById("location");
        if (chapterEl) chapterEl.textContent = "O CHAPÉU SELETOR";
        if (locationEl) locationEl.textContent = "Grande Salão";

        sceneEl.innerHTML = "";
        choicesEl.innerHTML = "";

        var title = document.createElement("h2");
        title.className = "story-title";
        title.textContent = "Seleção de Casa — " + (character.name || "Protagonista");
        sceneEl.appendChild(title);

        var intro = document.createElement("p");
        intro.textContent = (character.name || "Protagonista") + ", o Chapéu Seletor aguarda sua resposta. (Pergunta " + (quizIndex + 1) + " de " + houseQuiz.length + ")";
        sceneEl.appendChild(intro);

        var q = document.createElement("p");
        q.className = "quiz-question";
        q.style.fontWeight = "bold";
        q.style.marginTop = "16px";
        q.textContent = pergunta.question;
        sceneEl.appendChild(q);

        pergunta.answers.forEach(function (answer, idx) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "choice-button";
            btn.textContent = (idx + 1) + ". " + answer.text;
            btn.addEventListener("click", function () {
                quizAnswers[quizPlayer].push(answer);
                // Bônus de atributo
                if (window.game[quizPlayer] && answer.attribute) {
                    window.game[quizPlayer][answer.attribute] = (window.game[quizPlayer][answer.attribute] || 0) + 3;
                }
                quizIndex++;
                if (quizIndex < houseQuiz.length) {
                    renderPergunta();
                } else {
                    finalizarCasa();
                }
            });
            choicesEl.appendChild(btn);
        });
    }

    // -------- FINALIZA A SELEÇÃO DE UMA CASA --------
    function finalizarCasa() {
        var casa = calcularCasa(quizPlayer);
        window.game[quizPlayer].house = casa;

        var sceneEl = document.getElementById("scene");
        var choicesEl = document.getElementById("choices");
        if (!sceneEl || !choicesEl) return;

        sceneEl.innerHTML = "";
        choicesEl.innerHTML = "";

        var title = document.createElement("h2");
        title.className = "story-title";
        title.textContent = "O Chapéu decidiu!";
        sceneEl.appendChild(title);

        var p = document.createElement("p");
        p.textContent = "As respostas de " + window.game[quizPlayer].name + " indicam uma forte afinidade com " + casa + ".";
        sceneEl.appendChild(p);

        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice-button continue-button";
        btn.textContent = "Continuar";

        btn.addEventListener("click", function () {
            if (quizPlayer === "sasah") {
                quizPlayer = "lucas";
                quizIndex = 0;
                renderPergunta();
            } else {
                // Ambos escolheram casa — começa a história
                if (typeof window.showScene === "function") {
                    window.game.phase = "story";
                    window.game.flags.gameStarted = true;
                    try {
                        window.showScene("arrival_1");
                    } catch (e) {
                        console.error("Erro ao iniciar história:", e);
                    }
                } else {
                    // Fallback: mostra mensagem simples
                    sceneEl.innerHTML = "<h2 class='story-title'>Pronto para a aventura!</h2>" +
                        "<p>" + window.game.sasah.name + " (" + window.game.sasah.house + ") e " +
                        window.game.lucas.name + " (" + window.game.lucas.house + ") estão prontos.</p>" +
                        "<p>Mas o script principal da história não foi carregado corretamente.</p>";
                    choicesEl.innerHTML = "";
                }
            }
        });
        choicesEl.appendChild(btn);
    }

    // -------- INICIA O QUIZ PARA UM PERSONAGEM --------
    function iniciarQuiz(characterKey) {
        ensureGame();
        quizPlayer = characterKey;
        quizIndex = 0;
        quizAnswers[characterKey] = [];
        renderPergunta();
    }

    // -------- TELA DE NOMES --------
    function iniciarTelaDeNomes() {
        console.log("🎮 Inicializando tela de nomes...");

        try {
            localStorage.removeItem("hogwarts_rpg_final_v10");
            localStorage.removeItem("hogwarts_rpg_v10");
            localStorage.removeItem("hogwarts_rpg_v9");
            localStorage.removeItem("hogwarts_rpg_v8");
        } catch (e) { /* ignora */ }

        ensureGame();
        window.game.phase = "names";
        window.game.currentScene = null;
        window.game.currentSceneId = null;

        var sceneEl = document.getElementById("scene");
        var choicesEl = document.getElementById("choices");
        if (!sceneEl || !choicesEl) return;

        sceneEl.innerHTML =
            '<h2 class="story-title">Antes de Hogwarts</h2>' +
            '<p>Duas pessoas estão prestes a descobrir que suas vidas estão ligadas a um dos maiores mistérios mágicos de Hogwarts. Antes que a aventura comece, escolha o nome dos dois personagens que viverão esta história.</p>' +
            '<div class="name-selection" style="margin-top: 24px;">' +
                '<div class="name-group">' +
                    '<label for="nameInput1">Nome do personagem 1</label>' +
                    '<input type="text" id="nameInput1" placeholder="Digite o primeiro nome" maxlength="30" autocomplete="off" value="Sasah">' +
                '</div>' +
                '<div class="name-group">' +
                    '<label for="nameInput2">Nome do personagem 2</label>' +
                    '<input type="text" id="nameInput2" placeholder="Digite o segundo nome" maxlength="30" autocomplete="off" value="Lucas">' +
                '</div>' +
            '</div>';

        choicesEl.innerHTML = '<button type="button" id="startGameButton" class="choice-button continue-button">Começar aventura</button>';

        var btn = document.getElementById("startGameButton");
        btn.addEventListener("click", function () {
            var n1El = document.getElementById("nameInput1");
            var n2El = document.getElementById("nameInput2");
            var n1 = (n1El && n1El.value.trim()) || "Sasah";
            var n2 = (n2El && n2El.value.trim()) || "Lucas";

            console.log("✅ Nomes escolhidos:", n1, "e", n2);

            ensureGame();
            window.game.sasah.name = n1;
            window.game.lucas.name = n2;
            window.game.phase = "quiz_sasah";

            var sasahNameEl = document.getElementById("sasahName");
            var lucasNameEl = document.getElementById("lucasName");
            if (sasahNameEl) sasahNameEl.textContent = n1;
            if (lucasNameEl) lucasNameEl.textContent = n2;

            // Inicia o quiz embutido (não depende do script.js)
            iniciarQuiz("sasah");
        });

        console.log("✅ Tela de nomes pronta.");
    }

    // -------- BOOT --------
    if (document.readyState === "complete") {
        setTimeout(iniciarTelaDeNomes, 300);
    } else {
        window.addEventListener("load", function () {
            setTimeout(iniciarTelaDeNomes, 300);
        });
    }
})();
</script>
